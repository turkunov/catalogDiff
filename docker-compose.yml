# All ports are bound to 127.0.0.1: Jupyter and the app have no authentication. Use an SSH tunnel.
# Machine-specific values (GPUs, paths, Grafana password) live in .env — see .env.example.
services:
  vllm:
    build: docker/vllm-cu129
    image: catalogdiff/vllm-openai:v0.32.0-cu129-fix
    container_name: pl-vllm
    restart: unless-stopped
    gpus:
      - driver: nvidia
        device_ids: ["${VLLM_GPU:-7}"]
        capabilities: [gpu]
    shm_size: "16g"
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - OMP_NUM_THREADS=1
      # The cu129 build runs on driver 560 through CUDA forward compatibility.
      - NVIDIA_DISABLE_REQUIRE=1
    volumes:
      - ${MODELS_CACHE_DIR:-./models-cache}:/root/.cache/huggingface
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen3.5-27B}
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --max-model-len 8192
      --max-num-seqs 4
      --gpu-memory-utilization 0.9
      --enforce-eager
      --dtype bfloat16

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: catalogdiff/pseudolabel-app:latest
    container_name: pl-app
    restart: unless-stopped
    depends_on:
      - vllm
    gpus:
      - driver: nvidia
        device_ids: ["${ENCODER_GPU:-0}"]
        capabilities: [gpu]
    ports:
      - "127.0.0.1:8888:7860"
      - "127.0.0.1:8891:9001"
    environment:
      - VLLM_BASE_URL=http://vllm:8000/v1
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen3.5-27B}
      - PL_WORK_DIR=/data/pseudolabel
      - PL_ENCODER_DEVICE=cuda
      - PL_VLM_CONCURRENCY=4
      - HF_TOKEN=${HF_TOKEN:-}
      - GRADIO_ANALYTICS_ENABLED=False
    volumes:
      - .:/workspace/app
      - ${DATA_DIR:?set DATA_DIR in .env}:/data
      - ${MODELS_CACHE_DIR:-./models-cache}:/root/.cache/huggingface

  jupyter:
    build:
      context: ./jupyter
    container_name: pl-jupyter
    restart: unless-stopped
    ports:
      - "127.0.0.1:8889:8889"
    volumes:
      - ./notebooks:/workspace/notebooks
      - ${DATA_DIR:?set DATA_DIR in .env}:/data
    working_dir: /workspace/notebooks
    command: >
      jupyter lab --ip=0.0.0.0 --port=8889 --allow-root --ServerApp.token= --ServerApp.password=

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: pl-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: pl-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_DEFAULT_THEME=light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
