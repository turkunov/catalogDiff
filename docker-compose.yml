services:
  vllm:
    image: vllm/vllm-openai:v0.8.5
    container_name: vllm-qwen3-vl
    restart: unless-stopped
    gpus: all
    shm_size: "16g"
    ports:
      - "8001:8000"
    environment:
      # Optional: set HF_TOKEN in your shell before running docker compose up.
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      # Recommended in vLLM docs to avoid CPU thread contention.
      - OMP_NUM_THREADS=1
    volumes:
      - ./models-cache:/root/.cache/huggingface
    command: >
      --model Qwen/Qwen2.5-VL-7B-Instruct
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --max-model-len 8192
      --max-num-seqs 4
      --gpu-memory-utilization 0.9
      --enforce-eager
      --dtype bfloat16
  jupyter:
    build:
      context: ./jupyter
    container_name: qwen3-vl-jupyter
    restart: unless-stopped
    depends_on:
      - vllm
    ports:
      - "8889:8889"
    volumes:
      - ./notebooks:/workspace/notebooks
    working_dir: /workspace/notebooks
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8889
      --allow-root
      --ServerApp.token=
      --ServerApp.password=

  gradio:
    build:
      context: ./jupyter
    container_name: qwen3-vl-gradio
    restart: unless-stopped
    depends_on:
      - vllm
    ports:
      - "8888:7860"
      - "8891:9001"
    environment:
      - VLLM_BASE_URL=http://vllm:8000/v1
      - VLLM_MODEL=Qwen/Qwen2.5-VL-7B-Instruct
      - VLLM_API_KEY=EMPTY
      - POOL_NAMES=pool-a,pool-b,pool-c
      - METRICS_PORT=9001
      - GRADIO_ANALYTICS_ENABLED=False
      - HF_HUB_DISABLE_TELEMETRY=1
    volumes:
      - ./notebooks:/workspace/notebooks
    working_dir: /workspace/notebooks
    command: >
      python gradio_labeling_app.py

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: qwen3-vl-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: qwen3-vl-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_DEFAULT_THEME=light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
