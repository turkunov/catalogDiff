# Extra vLLM servers for the labeler ablations, one model per GPU; GPU 7 keeps the main 27B server (service vllm).
# Spec: docs/superpowers/specs/2026-10-23-labeler-ablations-design.md. Start next to the main stack:
#   docker compose -f docker-compose.yml -f docker-compose.ablations.yml up -d vllm-9b-0 ...
x-vllm: &vllm
  image: catalogdiff/vllm-openai:v0.32.0-cu129-fix
  restart: "no"
  shm_size: "16g"
  environment:
    - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    - HF_HUB_DISABLE_XET=1
    - OMP_NUM_THREADS=1
    - NVIDIA_DISABLE_REQUIRE=1
  volumes:
    - ${MODELS_CACHE_DIR:-./models-cache}:/root/.cache/huggingface

services:
  vllm-9b-0:
    <<: *vllm
    container_name: pl-vllm-9b-0
    gpus: [{driver: nvidia, device_ids: ["0"], capabilities: [gpu]}]  # shared with the app (encoder, segmentation)
    ports: ["127.0.0.1:8011:8000"]
    command: "--model Qwen/Qwen3.5-9B --gpu-memory-utilization 0.75 --host 0.0.0.0 --port 8000 --trust-remote-code --max-model-len 16384 --max-num-seqs 32 --dtype bfloat16 --limit-mm-per-prompt '{\"image\": 8}'"
  vllm-9b-1:
    <<: *vllm
    container_name: pl-vllm-9b-1
    gpus: [{driver: nvidia, device_ids: ["1"], capabilities: [gpu]}]
    ports: ["127.0.0.1:8012:8000"]
    command: "--model Qwen/Qwen3.5-9B --gpu-memory-utilization 0.9 --host 0.0.0.0 --port 8000 --trust-remote-code --max-model-len 16384 --max-num-seqs 32 --dtype bfloat16 --limit-mm-per-prompt '{\"image\": 8}'"
  vllm-9b-2:
    <<: *vllm
    container_name: pl-vllm-9b-2
    gpus: [{driver: nvidia, device_ids: ["2"], capabilities: [gpu]}]
    ports: ["127.0.0.1:8013:8000"]
    command: "--model Qwen/Qwen3.5-9B --gpu-memory-utilization 0.9 --host 0.0.0.0 --port 8000 --trust-remote-code --max-model-len 16384 --max-num-seqs 32 --dtype bfloat16 --limit-mm-per-prompt '{\"image\": 8}'"
  vllm-9b-6:
    <<: *vllm
    container_name: pl-vllm-9b-6
    gpus: [{driver: nvidia, device_ids: ["6"], capabilities: [gpu]}]
    ports: ["127.0.0.1:8014:8000"]
    command: "--model Qwen/Qwen3.5-9B --gpu-memory-utilization 0.9 --host 0.0.0.0 --port 8000 --trust-remote-code --max-model-len 16384 --max-num-seqs 32 --dtype bfloat16 --limit-mm-per-prompt '{\"image\": 8}'"
  vllm-4b:
    <<: *vllm
    container_name: pl-vllm-4b
    gpus: [{driver: nvidia, device_ids: ["3"], capabilities: [gpu]}]
    ports: ["127.0.0.1:8015:8000"]
    command: "--model Qwen/Qwen3.5-4B --gpu-memory-utilization 0.9 --host 0.0.0.0 --port 8000 --trust-remote-code --max-model-len 16384 --max-num-seqs 32 --dtype bfloat16 --limit-mm-per-prompt '{\"image\": 8}'"
  vllm-qwen25vl-7b:
    <<: *vllm
    container_name: pl-vllm-qwen25vl-7b
    gpus: [{driver: nvidia, device_ids: ["4"], capabilities: [gpu]}]
    ports: ["127.0.0.1:8016:8000"]
    command: "--model Qwen/Qwen2.5-VL-7B-Instruct --gpu-memory-utilization 0.9 --host 0.0.0.0 --port 8000 --trust-remote-code --max-model-len 16384 --max-num-seqs 32 --dtype bfloat16 --limit-mm-per-prompt '{\"image\": 8}'"
  vllm-internvl35-8b:
    <<: *vllm
    container_name: pl-vllm-internvl35-8b
    gpus: [{driver: nvidia, device_ids: ["5"], capabilities: [gpu]}]
    ports: ["127.0.0.1:8017:8000"]
    command: "--model OpenGVLab/InternVL3_5-8B --gpu-memory-utilization 0.9 --host 0.0.0.0 --port 8000 --trust-remote-code --max-model-len 16384 --max-num-seqs 32 --dtype bfloat16 --limit-mm-per-prompt '{\"image\": 8}'"
