<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ручная разметка пар</title>
<style>
  :root { --bg: #f6f6f4; --card: #fff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc;
          --accent: #2f5bd3; --done: #3b8f5a; --sel: #ffd166; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line);
           padding: 8px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header b { font-size: 16px; }
  .bar { flex: 1; min-width: 160px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--done); width: 0; transition: width .2s; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .side { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  .side h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .side img { width: 100%; height: 52vh; object-fit: contain; background: #fafaf8; border-radius: 6px; cursor: zoom-in; }
  .title { font-weight: 600; margin: 8px 0 4px; }
  .params { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .params span { background: #eef1fa; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
  .desc { max-height: 22vh; overflow: auto; white-space: pre-wrap; color: #33332f; font-size: 13px; border-top: 1px solid var(--line); padding-top: 6px; }
  .controls { grid-column: 1 / 2; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--card);
              border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .cls { min-width: 44px; font-weight: 700; font-size: 16px; }
  .cls.on { background: var(--sel); border-color: #e0a800; }
  #comment { flex: 1; min-width: 200px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  aside { grid-row: 1 / 3; grid-column: 2; display: flex; flex-direction: column; gap: 12px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .panel p { margin: 0 0 8px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
  .grid div { height: 16px; border-radius: 3px; background: var(--line); cursor: pointer; font-size: 9px; text-align: center; line-height: 16px; color: #fff; }
  .grid div.done { background: var(--done); }
  .grid div.cur { outline: 2px solid var(--accent); }
  .keys { color: var(--muted); font-size: 12px; }
  .saved { color: var(--done); font-size: 12px; min-width: 70px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } aside { grid-row: auto; grid-column: 1; } .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <b>Пара <span id="pos">–</span> / <span id="total">–</span></b>
  <span>Размечено: <b id="done">0</b></span>
  <div class="bar"><div id="bar"></div></div>
  <button id="prev" title="←">← Назад</button>
  <button id="next" title="→">Вперёд →</button>
  <button id="nextFree" title="N">Следующая неразмеченная (N)</button>
  <a href="/export.csv" download="manual_labels.csv"><button>Скачать CSV</button></a>
</header>
<main>
  <section class="pair">
    <div class="side" id="a"><h3>Объявление 1 · Avito</h3></div>
    <div class="side" id="b"><h3>Объявление 2 · Ozon</h3></div>
  </section>
  <section class="controls">
    <span>Класс:</span>
    <button class="cls" data-c="1">1</button><button class="cls" data-c="2">2</button>
    <button class="cls" data-c="3">3</button><button class="cls" data-c="4">4</button>
    <button class="cls" data-c="5">5</button>
    <button id="clear" title="0">Сбросить (0)</button>
    <input id="comment" placeholder="Комментарий (Enter — сохранить)">
    <span class="saved" id="saved"></span>
  </section>
  <aside>
    <div class="panel"><b>Шкала</b><div id="legend"></div>
      <p class="keys">Клавиши: 1–5 — поставить класс и перейти к следующей неразмеченной; ← → — листать; 0 — сбросить; N — следующая неразмеченная; клик по фото — открыть крупно.</p>
    </div>
    <div class="panel"><b>Все пары</b><div class="grid" id="grid"></div></div>
  </aside>
</main>
<script>
let cur = 0, total = 0, status = [], current = null;
let busy = false;  // true while a label is being saved or the next pair (with its photos) is loading
const $ = (id) => document.getElementById(id);

function md(text) {  // minimal **bold** + paragraphs
  return text.trim().split(/\n\s*\n/).map(p => "<p>" + p.replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>") + "</p>").join("");
}

const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function renderSide(el, title, s) {
  const params = Object.entries(s.params).map(([k, v]) => `<span>${esc(k)}: ${esc(v ?? "—")}</span>`).join("");
  el.innerHTML = `<h3>${title}</h3>
    <a href="${s.image}" target="_blank"><img src="${s.image}" alt=""></a>
    <div class="title"></div><div class="params">${params}</div><div class="desc"></div>`;
  el.querySelector(".title").textContent = s.title || "—";
  el.querySelector(".desc").textContent = s.description || "";
}

function renderGrid() {
  const g = $("grid");
  g.innerHTML = "";
  status.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = (s.cls ? "done" : "") + (i === cur ? " cur" : "");
    d.textContent = s.cls || "";
    d.title = `Пара ${i + 1}`;
    d.onclick = () => go(i);
    g.appendChild(d);
  });
  const done = status.filter(s => s.cls).length;
  $("done").textContent = done;
  $("bar").style.width = (100 * done / total) + "%";
}

async function refreshStatus() { status = await (await fetch("/api/status")).json(); total = status.length; renderGrid(); }

function imagesLoaded(timeoutMs = 4000) {
  const imgs = [...document.querySelectorAll(".side img")];
  const loaded = imgs.map(img => img.complete ? Promise.resolve() :
    new Promise(res => { img.addEventListener("load", res, { once: true }); img.addEventListener("error", res, { once: true }); }));
  return Promise.race([Promise.all(loaded), new Promise(res => setTimeout(res, timeoutMs))]);
}

async function go(i) {
  if (i < 0 || i >= total) return;
  busy = true;
  try {
    const next = await (await fetch(`/api/pair/${i}`)).json();
    cur = i; current = next;  // switch only once the new pair is here
    $("pos").textContent = i + 1; $("total").textContent = current.total;
    renderSide($("a"), "Объявление 1 · Avito", current.a);
    renderSide($("b"), "Объявление 2 · Ozon", current.b);
    $("comment").value = current.comment || "";
    document.querySelectorAll(".cls").forEach(b => b.classList.toggle("on", +b.dataset.c === current.cls));
    $("saved").textContent = "";
    renderGrid();
    window.scrollTo(0, 0);
    await imagesLoaded();
  } finally {
    busy = false;
  }
}

async function save(cls, advance) {
  if (busy || !current) return;  // ignore keys until the shown pair is fully loaded
  busy = true;
  const idx = current.idx;  // the pair on screen, not whatever is loading next
  try {
    const r = await fetch("/api/label", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ idx, cls, comment: $("comment").value }) });
    if (!r.ok) { $("saved").textContent = "Ошибка!"; return; }
    status[idx].cls = cls; current.cls = cls;
    document.querySelectorAll(".cls").forEach(b => b.classList.toggle("on", +b.dataset.c === cls));
    $("saved").textContent = "Сохранено ✓";
    renderGrid();
  } finally {
    busy = false;
  }
  if (advance) await nextFree();
}

async function nextFree() {
  for (let k = 1; k <= total; k++) { const i = (cur + k) % total; if (!status[i].cls) return go(i); }
  $("saved").textContent = "Все пары размечены 🎉";
}

document.querySelectorAll(".cls").forEach(b => b.onclick = () => save(+b.dataset.c, true));
$("clear").onclick = () => save(null, false);
$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
$("nextFree").onclick = nextFree;
$("comment").addEventListener("keydown", e => { if (e.key === "Enter" && current.cls) save(current.cls, false); });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || busy) return;
  if (/^[1-5]$/.test(e.key)) save(+e.key, true);
  else if (e.key === "0") save(null, false);
  else if (e.key === "ArrowLeft") go(cur - 1);
  else if (e.key === "ArrowRight") go(cur + 1);
  else if (e.key === "n" || e.key === "N" || e.key === "т" || e.key === "Т") nextFree();
});

(async () => {
  $("legend").innerHTML = md(await (await fetch("/api/legend")).text());
  await refreshStatus();
  const first = status.findIndex(s => !s.cls);
  go(first >= 0 ? first : 0);
})();
</script>
</body>
</html>
