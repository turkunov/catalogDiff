class_definitions:
  1: >-
    Не сравнить. Хотя бы в одном объявлении не диван (образцы ткани, интерьер без дивана,
    другой предмет) или по фото нельзя понять, что продаётся.
  2: >-
    Разные товары. Другая категория (пуф, кресло, кровать, кушетка против дивана) или явно разные
    ключевые параметры: форма (прямой / угловой / П-образный / модульный), материал обивки,
    основной цвет. Та же модель в другом цвете или другой обивке — это тоже 2.
  3: >-
    Похожи только по параметрам. Форма, обивка и цвет согласуются, но по фото это заметно разные
    модели (силуэт, подлокотники, спинка, ножки) — или диван накрыт пледом или чехлом и его не
    разглядеть.
  4: >-
    Очень похожи. Параметры и внешний вид совпадают, но есть отличия, указывающие на другую модель
    или модификацию: детали, размер, механизм, декор.
  5: >-
    Та же модель. Совпадают параметры и внешний вид, включая цвет; отличаются только ракурс, фон,
    качество фото.
match_rules: >-
  Сначала смотри на фото, текст — подсказка: название модели, механизм, размеры. Игнорируй людей,
  фон и посторонние предметы. Оттенки одного цвета считай одним цветом (бежевый ≈ кремовый ≈
  песочный, серый ≈ графитовый ≈ антрацит), разные цвета — конфликт параметра. Велюр и микровелюр
  считай одним материалом; рогожка, букле, жаккард, шенилл, экокожа и кожа — разные материалы.
  Модульный диван может быть собран в разную форму — сравнивай модули по фото. Размеры в мм, см
  и м сравнивай численно с допуском 2%. Названия моделей сравнивай без учёта регистра, пробелов,
  дефисов и транслита (Роденго = rodengo).
