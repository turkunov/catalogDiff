    description: основной цвет обивки
  - key: form
    description: "форма: прямой, угловой, П-образный, модульный, круглый или полукруглый"
  - key: upholstery
    description: "тип обивки на вид: велюр, рогожка, букле, жаккард, экокожа, кожа или другое"
